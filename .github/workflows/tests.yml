name: Translator tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact public reference-validator subject
        uses: actions/checkout@v4
        with:
          repository: thebrazenbeard/unvtrslr
          ref: 769d8f8a1b7cb4e8b68189e6279222d48269df8f
          path: .unvtrslr_peer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source and translation behavior
        env:
          NUMTAREEN_ROOT: ${{ github.workspace }}
          UNVTRSLR_ROOT: ${{ github.workspace }}/.unvtrslr_peer
        run: python -m unittest discover -s tests -v
      - name: Verify reference adapter on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-NumtareenInterop.ps1
      - name: Verify reference adapter on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Test-NumtareenInterop.ps1
      - name: Verify PowerShell entrypoint and Unicode roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ntToEn = & ./scripts/Translate-Numtareen.ps1 -Direction nt-en -Text 'Nûm ta=en ech.'
          if ($LASTEXITCODE -ne 0) { throw 'NT to English launcher failed' }
          if (($ntToEn -join "`n") -notmatch 'You are aligned') {
            throw 'NT to English launcher did not return its attested gloss'
          }
          $enToNt = & ./scripts/Translate-Numtareen.ps1 -Direction en-nt -Text 'Stop. Do not proceed.'
          if ($LASTEXITCODE -ne 0) { throw 'English to NT launcher failed' }
          $expected = 'Ta' + [char]0x2019 + 'qesh.'
          if (($enToNt -join "`n").IndexOf($expected, [StringComparison]::Ordinal) -lt 0) {
            throw 'English to NT launcher did not return its attested text'
          }
      - name: Verify Windows PowerShell 5.1 UTF-8 argument transport
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $enToNt = & ./scripts/Translate-Numtareen.ps1 -Direction en-nt -Text 'Stop. Do not proceed.'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 launcher failed' }
          $expected = 'Ta' + [char]0x2019 + 'qesh.'
          if (($enToNt -join "`n").IndexOf($expected, [StringComparison]::Ordinal) -lt 0) {
            throw 'PowerShell 5.1 launcher corrupted an attested Unicode translation'
          }
          $nonBmp = [char]::ConvertFromUtf32(0x1F680)
          $quoteMarker = 'emb"edded'
          $probe = 'unattested ' + $quoteMarker + ' ' + $nonBmp
          $unknown = & ./scripts/Translate-Numtareen.ps1 -Direction nt-en -Unknown mark -Text $probe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 quoted-input launch failed' }
          if (($unknown -join "`n").IndexOf($nonBmp, [StringComparison]::Ordinal) -lt 0) {
            throw 'PowerShell 5.1 launcher lost non-BMP Unicode input'
          }
          if (($unknown -join "`n").IndexOf($quoteMarker, [StringComparison]::Ordinal) -lt 0) {
            throw 'PowerShell 5.1 launcher lost an embedded double quote'
          }
