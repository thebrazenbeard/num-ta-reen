name: Current public peer interoperability

on:
  push:
  pull_request:

permissions:
  contents: read

# This lane supplements, and does not replace, the older immutable
# reference-validator pin in tests.yml. A pass qualifies only this exact pair.
jobs:
  exact-current-peer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout Num'ta'reen subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed Universal Translator peer
        uses: actions/checkout@v4
        with:
          repository: thebrazenbeard/unvtrslr
          # Exact reviewed V0 sidecar research peer; not an unpinned main.
          ref: d113df8b72385300c570ccb9d1c8a36f20ddb738
          path: .unvtrslr_current_peer
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact public peer and dependencies
        run: python -m pip install -e ./.unvtrslr_current_peer
      - name: Verify authored-reference interoperability
        env:
          NUMTAREEN_ROOT: ${{ github.workspace }}
          UNVTRSLR_ROOT: ${{ format('{0}/.unvtrslr_current_peer', github.workspace) }}
        run: python -m unittest discover -s tests -p test_unvtrslr_interop.py -q
      - name: Verify opt-in typed semantic research sidecars (not learner input)
        env:
          NUMTAREEN_ROOT: ${{ github.workspace }}
          UNVTRSLR_ROOT: ${{ format('{0}/.unvtrslr_current_peer', github.workspace) }}
        run: python -m unittest discover -s tests -p peer_typed_reference_sidecar_v0.py -v
      - name: Verify blind waveform interoperability and negative controls
        env:
          NUMTAREEN_ROOT: ${{ github.workspace }}
          UNVTRSLR_ROOT: ${{ format('{0}/.unvtrslr_current_peer', github.workspace) }}
        run: python -m unittest discover -s tests -p test_experimental_resonance_identifiability.py -q
      - name: Verify evaluator-only eight-state acoustic benchmark
        env:
          NUMTAREEN_ROOT: ${{ github.workspace }}
          UNVTRSLR_ROOT: ${{ format('{0}/.unvtrslr_current_peer', github.workspace) }}
        run: python -m unittest discover -s tests -p test_crossrepo_acoustic_benchmark.py -q
      - name: PowerShell 7 source-reference adapter smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-NumtareenInterop.ps1
      - name: Windows PowerShell 5.1 source-reference adapter smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Test-NumtareenInterop.ps1
